name: Dev Front CI/CD

on:
  push:
    branches: [ dev ]

env:
  FRONT_APP_DIR: ${{ secrets.FRONT_APP_DIR_TEST_ENV }}
  FRONT_ARCHIVE_DIR: ${{ secrets.FRONT_ARCHIVE_DIR_TEST_ENV }}
  DOCKER_TEST_DIR: ${{ secrets.DOCKER_TEST_DIR_TEST_ENV }}
  PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'https://milkyway.test/nebula/app' }}
  VITE_PUBLIC_URL: ${{ secrets.VITE_PUBLIC_URL || '/nebula/app/' }}
  VITE_REQUEST_URL: ${{ secrets.VITE_REQUEST_URL || 'https://milkyway.test/nebula/api/v1' }}


jobs:
  build-deploy:
    runs-on: [ self-hosted, Linux, X64, test ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Clean npm cache on runner
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Test with Coverage
        run: npm run test:coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

      - name: Show current directory and files
        run: |
          pwd
          ls -l

      - name: Run build
        env:
          VITE_USERNAME: ${{ secrets.VITE_USERNAME }}
          VITE_PASSWORD: ${{ secrets.VITE_PASSWORD }}
          VITE_TOMCAT_DOMAIN: ${{ secrets.VITE_TOMCAT_DOMAIN }}
          VITE_APACHE_DOMAIN: ${{ secrets.VITE_APACHE_DOMAIN }}
          VITE_RESOURCES_DOMAIN: ${{ secrets.VITE_RESOURCES_DOMAIN }}
          VITE_REQUEST_URL: ${{ secrets.VITE_REQUEST_URL }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebula-front-dist
          path: dist/

      - name: Deploy static files and restart frontend container
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          APP_DIR="${FRONT_APP_DIR}"
          ARCHIVE_DIR="${FRONT_ARCHIVE_DIR}"
          DOCKER_DIR="${DOCKER_TEST_DIR}"
          
          # Resolve version: package.json version + git short SHA
          VERSION=$(node -p "require('./package.json').version")
          GIT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="${VERSION}-${GIT_SHA}"

          echo "Deploying version: ${FULL_VERSION}"

          sudo mkdir -p "$APP_DIR" "$ARCHIVE_DIR"
          sudo chown -R wolf:wolf "$APP_DIR" "$ARCHIVE_DIR"

          # Archive current build as versioned tar.gz
          tar -czf "${ARCHIVE_DIR}/nebula-front##${FULL_VERSION}.tar.gz" -C dist .

          # Clean current deployment
          find "$APP_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          # Copy new static build
          cp -a dist/. "$APP_DIR"/

          # Restart frontend container
          cd "$DOCKER_DIR"
          docker compose up -d --build --force-recreate nebula-front-app-test
          sudo chown -R wolf:wolf "$APP_DIR" "$ARCHIVE_DIR"

  e2e-tests:
    needs: build-deploy
    runs-on: [ self-hosted, Linux, X64, test ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Clean npm cache on runner
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-browsers-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-browsers-

      - name: Install Playwright browsers (with deps)
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_IGNORE_HTTPS: '1'
          CI: 'true'
        run: |
          # wait for frontend to be ready
          echo "Waiting for frontend at ${{ env.PLAYWRIGHT_BASE_URL }}..."
          timeout 60s bash -c 'until curl -k -s --fail "${{ env.PLAYWRIGHT_BASE_URL }}" > /dev/null; do echo "Waiting for app..."; sleep 5; done' || (echo "Frontend is not available after 60s"; exit 1)

          # use single worker on self-hosted to reduce load and flakiness
          npx playwright test --reporter=list --workers=1
        continue-on-error: false

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
