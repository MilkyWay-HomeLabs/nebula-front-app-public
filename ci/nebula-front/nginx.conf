# Ported from infrastructure/docker/test/nginx/nebula-front/nginx.conf.
# No stripPrefix on the Traefik side — nginx matches /nebula/app/ directly.

events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    server_name _;

    location /nebula/app/ {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /nebula/app/index.html;
    }

    location /nebula/app/assets/ {
      alias /usr/share/nginx/html/nebula/app/assets/;
      expires 7d;
      access_log off;
      try_files $uri =404;
    }

    # Scraped by the nginx-prometheus-exporter sidecar over localhost only
    # (see terraform/modules/nebula-front in the infra repo) - never exposed
    # outside the pod.
    location = /nginx_status {
      stub_status;
      allow 127.0.0.1;
      deny all;
    }
  }
}
